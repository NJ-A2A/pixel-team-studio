<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NestLinker Office Widget settings</title>
    <style>
      body{max-width:720px;margin:48px auto;padding:0 24px;color:#152a22;background:#fff8ef;font-family:Inter,Arial,sans-serif}main{padding:28px;border:2px solid #152a22;border-radius:16px;background:#fff;box-shadow:7px 7px 0 #152a22}h1{margin-top:0;font-size:24px}label{display:block;margin:24px 0 7px;font-size:12px;font-weight:800}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #152a22;border-radius:8px;font:inherit}button{margin-top:14px;padding:9px 15px;border:1px solid #152a22;border-radius:999px;color:#152a22;background:#f6e5a9;font:800 12px Inter,Arial;cursor:pointer}small{display:block;margin-top:12px;color:#5b6c65}#status{color:#357554;font-weight:800}
    </style>
  </head>
  <body>
    <main><h1>NestLinker Office Widget</h1><p>Use the local Vite URL while developing, or replace it with the deployed HTTPS widget URL.</p><label for="widgetUrl">Widget URL</label><input id="widgetUrl" type="url" /><button id="save" type="button">Save URL</button><small id="status"></small></main>
    <script src="options.js"></script>
  </body>
</html>
